[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpo"
version = "0.1.0"
description = "Contextual Credit Policy Optimization: step-level credit for LLM agents from historical and future contextual credit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["ccpo*"]
